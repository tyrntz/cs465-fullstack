
<div class="container mt-4">
  <h2>Edit Trip</h2>
  <p>Update the information for an existing trip.</p>

  <div *ngIf="message" class="alert alert-info">
    {{ message }}
  </div>

  <form (ngSubmit)="onSubmit()" #tripForm="ngForm">

    <div class="mb-3">
      <label class="form-label">Trip Code</label>
      <input type="text" class="form-control"
             name="code" [(ngModel)]="trip.code"
             readonly>
    </div>

    <div class="mb-3">
      <label class="form-label">Trip Name</label>
      <input type="text" class="form-control"
             name="name" [(ngModel)]="trip.name"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Duration</label>
      <input type="text" class="form-control"
             name="length" [(ngModel)]="trip.length"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Start Date</label>
      <input type="date" class="form-control"
             name="start" [(ngModel)]="trip.start"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Resort</label>
      <input type="text" class="form-control"
             name="resort" [(ngModel)]="trip.resort"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Price Per Person</label>
      <input type="text" class="form-control"
             name="perPerson" [(ngModel)]="trip.perPerson"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Image Filename</label>
      <input type="text" class="form-control"
             name="image" [(ngModel)]="trip.image"
             required>
    </div>

    <div class="mb-3">
      <label class="form-label">Description</label>
      <textarea class="form-control" rows="4"
                name="description"
                [(ngModel)]="trip.description"
                required></textarea>
    </div>

    <button type="submit" class="btn btn-primary"
            [disabled]="tripForm.invalid || saving">
      {{ saving ? 'Saving...' : 'Update Trip' }}
    </button>

    <a routerLink="/" class="btn btn-secondary ms-2">
      Cancel
    </a>

  </form>
</div>
