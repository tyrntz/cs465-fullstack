<div class="container mt-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-header">
          <h3>Travlr Admin Login</h3>
        </div>

        <div class="card-body">
          <form (ngSubmit)="onLoginSubmit()">

            <div class="mb-3">
              <label for="email" class="form-label">
                Email Address
              </label>

              <input
                type="email"
                id="email"
                name="email"
                class="form-control"
                [(ngModel)]="credentials.email"
                required
              />
            </div>

            <div class="mb-3">
              <label for="password" class="form-label">
                Password
              </label>

              <input
                type="password"
                id="password"
                name="password"
                class="form-control"
                [(ngModel)]="credentials.password"
                required
              />
            </div>

            <div
              *ngIf="errorMessage"
              class="alert alert-danger"
            >
              {{ errorMessage }}
            </div>

            <button
              type="submit"
              class="btn btn-primary"
            >
              Login
            </button>

          </form>
        </div>
      </div>
    </div>
  </div>
</div>
