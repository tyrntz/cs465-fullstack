
<div class="card mb-4 shadow-sm">
  <div class="card-body">

    <h5 class="card-title">
      {{ trip.name }}
    </h5>

    <h6 class="card-subtitle mb-3 text-muted">
      {{ trip.resort }}
    </h6>

    <p class="card-text">
      <strong>Trip Code:</strong> {{ trip.code }}
    </p>

    <p class="card-text">
      <strong>Duration:</strong> {{ trip.length }}
    </p>

    <p class="card-text">
      <strong>Start Date:</strong> {{ trip.start | date:'mediumDate' }}
    </p>

    <p class="card-text">
      <strong>Price Per Person:</strong> ${{ trip.perPerson }}
    </p>

    <p class="card-text">
      <strong>Description:</strong> {{ trip.description }}
    </p>

    <a [routerLink]="['/edit-trip', trip.code]"
       class="btn btn-warning mt-3">
      Edit Trip
    </a>

  </div>
</div>
